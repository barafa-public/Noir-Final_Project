# Minimal. Jika `supabase init` sudah membuat config.toml, GABUNGKAN bagian [functions.*] saja.
project_id = "noir"

# Auth dibuat sendiri (JWT buatan sendiri), jadi gateway Supabase tidak boleh memverifikasi JWT.
# Otorisasi dilakukan di _shared/auth_guard.ts.

